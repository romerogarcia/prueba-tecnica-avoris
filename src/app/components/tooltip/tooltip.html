<span class="tooltip" (mouseenter)="show()" (mouseleave)="hide()">
  <button
    type="button"
    class="tooltip__trigger"
    (click)="onClick($event)"
    (focus)="show()"
    (blur)="hide()"
    [attr.aria-expanded]="open()"
    aria-label="Más información"
  >
    <ng-content></ng-content>
  </button>

  @if (open()) {
    <span class="tooltip__bubble" role="tooltip">{{ text() }}</span>
  }
</span>
